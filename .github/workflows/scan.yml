name: Scan QA jobs

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write             # to commit jobs.db + report back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python main.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-job-report
          path: |
            report.html
            report.csv

      - name: Persist seen-jobs database
        run: |
          git config user.name  "job-scanner"
          git config user.email "actions@github.com"
          git add jobs.db report.csv report.html
          git commit -m "chore: update job scan $(date -u +%FT%TZ)" || echo "no changes"
          git push || echo "nothing to push"
